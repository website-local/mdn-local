name: Upload release
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string

      run_id:
        description: 'Run id contains artifact being uploaded'
        required: true
        type: string

      tag_name:
        description: 'Release tag name'
        required: false
        type: string

jobs:
  release:
    name: Upload releases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20.x

      - name: Update package lists and install jq
        run: |
          sudo apt update
          sudo apt install jq p7zip-full -y
      - name: Validate download run and artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_ACTION_TOKEN || github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID" > run.json
          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > artifacts.json
          node scripts/select-release-artifacts.mjs run.json artifacts.json "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" > artifact-urls.txt

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_ACTION_TOKEN || github.token }}
        run: |
          mkdir -p download
          pushd download
          artifact_index=0
          while IFS= read -r url; do
            artifact_index=$((artifact_index + 1))
            curl --fail --silent --show-error -L \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$url" --output "artifact-$artifact_index.zip"
          done < ../artifact-urls.txt
          mkdir -p ../release
          for zip_file in *.zip; do
            unzip -o "$zip_file" -d ../release
          done
          popd

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      - name: Validate release archives
        run: |
          while IFS= read -r name; do
            test -s "release/$name.7z"
            7z t "release/$name.7z"
          done < <(jq -r '.artifacts[] | select(.name | startswith("developer.mozilla.org_")) | .name' artifacts.json)

      - name: Collect hash
        run: |
          pushd release
          sha256sum * > ../sha256sum.txt
          sha1sum * > ../sha1sum.txt
          popd
          echo -e '\n\nsha256sum\n-----------\n```\n' > release.txt
          cat sha256sum.txt >> release.txt
          echo -e '\n```\n\nsha1sum\n-----------\n```\n' >> release.txt
          cat sha1sum.txt >> release.txt
          echo -e '\n```\n' >> release.txt
          cat release.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.tag_name != '' }}
        with:
          draft: true
          prerelease: true
          tag_name: ${{ github.event.inputs.tag_name }}
          fail_on_unmatched_files: true
          body_path: release.txt
          files: release/*

