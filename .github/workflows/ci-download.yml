name: Download MDN Contents
permissions:
  contents: read
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string

env:
  node-version: 20.x

jobs:
  download:
    name: Download MDN Contents
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: [en-US, zh-CN]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.node-version }}

      - name: Update package lists and install 7-Zip
        run: |
          sudo apt update
          sudo apt install p7zip-full -y
          echo "short_date=$(date "+%Y%m%d")" >> $GITHUB_ENV

      - name: Set env
        run: |
          echo "build_name=developer.mozilla.org_${{ env.short_date }}_${{ matrix.locale }}" >> $GITHUB_ENV

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      - run: npm ci

      - name: Making download script
        run: |
          cat << EOF > src/mdn/run-downloader.ts
          import createDownloader from './mdn-downloader.js';
          createDownloader({
            localRoot: './dist/${{ env.build_name }}',
            minConcurrency: 11,
            req: {
              retry: {
                limit: 42
              }
            },
            meta: {
              locale: '${{ matrix.locale }}'
            }
          }).then(d => d.onIdle().then(() => d.dispose()))
            .catch(error => {
              console.error(error);
              process.exitCode = 1;
            });
          EOF
          ls -hl src/mdn/
          pwd

      - run: npm run build
      - name: debug
        run: |
          pwd
          ls -hl *
          ls -hl lib/mdn/
      - name: Running downloader
        run: node ./lib/mdn/run-downloader.js
      - name: Record build provenance
        env:
          BUILD_LOCALE: ${{ matrix.locale }}
          CUSTOM_COMMAND_USED: ${{ github.event.inputs.command != '' }}
        run: |
          node --input-type=module <<'EOF'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const lockfile = readFileSync('package-lock.json');
          const lock = JSON.parse(lockfile);
          const info = {
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            locale: process.env.BUILD_LOCALE,
            node: process.version,
            engine: lock.packages['node_modules/website-scrap-engine'].version,
            lockfileSha256: createHash('sha256').update(lockfile).digest('hex'),
            customCommandUsed: process.env.CUSTOM_COMMAND_USED === 'true'
          };
          writeFileSync(`dist/${process.env.build_name}/build-info.json`, JSON.stringify(info, null, 2) + '\n');
          EOF
      - name: Packaging
        run: |
          pushd dist
          7z a -m0=lzma2 -mx=9 -ms=on -myx=9 -mqs=on -md=28 ../${{ env.build_name }}.7z ${{ env.build_name }}
          popd
          7z t ${{ env.build_name }}.7z

      - name: Collecting logs
        if: always()
        continue-on-error: true
        run: |
          pushd dist
          7z a -m0=lzma2 -mx=9 -ms=on ../logs_${{ env.build_name }}.7z ${{ env.build_name }}/*/logs/
          popd

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        continue-on-error: true
        with:
          name: logs_${{ env.build_name }}
          path: logs*.7z

      - name: Uploading artifact
        id: upload_artifact
        uses: actions/upload-artifact@master
        with:
          name: ${{ env.build_name }}
          path: ${{ env.build_name }}.7z
          if-no-files-found: error
